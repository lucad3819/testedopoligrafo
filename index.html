<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Polígrafo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="jogo">
        <h1>Teste do Polígrafo</h1>
        <p>Investigação de Patrick Jane: responda às perguntas!</p>

        <div class="cenario">
            <div class="balao" id="pergunta">
                Vamos começar o interrogatório?
            </div>

            <img src="img/personagens.png" alt="Interrogatório com polígrafo">
        </div>

        <h3 id="numero">Pergunta 1 de 10</h3>

        <select id="resposta">
            <option value="">Selecione sua resposta</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
        </select>

        <button id="responder" onclick="responder()">Responder</button>

        <h2 id="resultado"></h2>

        <button id="reiniciar" onclick="reiniciarJogo()">
            Reiniciar
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
